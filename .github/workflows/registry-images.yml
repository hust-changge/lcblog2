name: Build lcblog2 images
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./B1gchangBlog-Backend
            file: ./deploy/registry/Dockerfile.backend
          - image: nginx
            context: .
            file: ./deploy/registry/Dockerfile.nginx
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/hust-changge/lcblog2-${{ matrix.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/hust-changge/lcblog2
